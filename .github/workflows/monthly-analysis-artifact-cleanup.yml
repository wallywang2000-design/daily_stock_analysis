name: Weekly Analysis Cleanup

on:
  schedule:
    # Saturday 03:00 Asia/Shanghai = Friday 19:00 UTC; GitHub may delay execution.
    - cron: '0 19 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (do not delete records or artifacts)'
        type: boolean
        required: true
        default: true

# Reuse the existing cleanup permission; no credentials are required.
permissions:
  actions: write

concurrency:
  group: analysis-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only completed runs of the original and new stock analysis workflows are in scope.
      # Delete records/logs and analysis report artifacts older than 5 x 24 hours.
      # Recent reruns, active jobs, CI and other maintenance workflows are preserved.
      - name: Clean analysis history older than five days
        uses: actions/github-script@v8
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const keepDays = 5;
            const cutoff = Date.now() - keepDays * 24 * 60 * 60 * 1000;
            const dryRun = context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run !== 'false';
            const analysisPaths = new Set([
              '.github/workflows/00-daily-analysis.yml',
              '.github/workflows/new-action-1029.yml',
            ]);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { ...repo, per_page: 100 });
            const analysisRuns = runs.filter(run => analysisPaths.has(run.path));
            const completedIds = new Set(analysisRuns.filter(run => run.status === 'completed').map(run => run.id));
            // Preserve active runs and any run created or updated within the last 120 hours.
            const targetRuns = analysisRuns.filter(run => run.status === 'completed' &&
              Date.parse(run.created_at) < cutoff && Date.parse(run.updated_at) < cutoff);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { ...repo, per_page: 100 });
            const targetArtifacts = artifacts.filter(artifact =>
              artifact.name?.startsWith('analysis-reports-') &&
              completedIds.has(artifact.workflow_run?.id) && Date.parse(artifact.created_at) < cutoff);
            core.info('Mode: ' + (dryRun ? 'PREVIEW ONLY' : 'DELETE') + '; cutoff: ' + new Date(cutoff).toISOString());
            for (const artifact of targetArtifacts) {
              core.info((dryRun ? 'Would delete' : 'Deleting') + ' artifact #' + artifact.id + ' ' + artifact.name);
              if (!dryRun) await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
            }
            for (const run of targetRuns) {
              core.info((dryRun ? 'Would delete' : 'Deleting') + ' run #' + run.id + ' ' + run.name + ' created ' + run.created_at);
              if (!dryRun) await github.rest.actions.deleteWorkflowRun({ ...repo, run_id: run.id });
            }
            await core.summary.addHeading('Weekly analysis cleanup')
              .addRaw('Schedule: Saturday 03:00 Asia/Shanghai (Friday 19:00 UTC).\n\n')
              .addTable([
                [{ data: 'Mode', header: true }, { data: 'Cutoff (UTC)', header: true }, { data: 'Runs', header: true }, { data: 'Artifacts', header: true }],
                [dryRun ? 'Preview only; nothing deleted' : 'Delete', new Date(cutoff).toISOString(), String(targetRuns.length), String(targetArtifacts.length)],
              ]).write();
