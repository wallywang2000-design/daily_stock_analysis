name: Gemini key check 1029
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Verify model isolation and real Wally fallback
        env:
          VERIFY_EXISTING_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERIFY_WALLY_KEY: ${{ secrets.GEMINI_WALLY_BACKUP_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, hmac, sys, yaml
          from pathlib import Path
          workflow=yaml.safe_load(Path('.github/workflows/new-action-1029.yml').read_text())
          source=next(step['env'] for step in workflow['jobs']['analyze']['steps'] if step.get('name')=='执行股票分析')
          existing=os.environ['VERIFY_EXISTING_KEY']
          wally=os.environ['VERIFY_WALLY_KEY']
          values={'$'+'{{ secrets.GEMINI_API_KEY }}':existing,'$'+'{{ secrets.GEMINI_WALLY_BACKUP_KEY }}':wally}
          names=['LITELLM_CONFIG','LITELLM_CONFIG_YAML','LITELLM_MODEL','LITELLM_FALLBACK_MODELS','LLM_CHANNELS']
          names += [name for name in source if name.startswith(('LLM_PRIMARY_','LLM_SECONDARY_'))]
          for name in names:
              value=str(source[name])
              os.environ[name]=values.get(value,value)
          from src.config import Config
          from src.analyzer import GeminiAnalyzer
          config=Config.get_instance()
          primary='gemini/gemini-3-flash-preview'
          backup='gemini/gemini-3.6-flash'
          assert config.litellm_model==primary
          assert config.litellm_fallback_models==[backup]
          deployments={entry['model_name']:entry['litellm_params'] for entry in config.llm_model_list}
          assert set(deployments)=={primary,backup}
          assert hmac.compare_digest(deployments[primary]['api_key'],existing)
          assert hmac.compare_digest(deployments[backup]['api_key'],wally)
          summary=['# Per-key model routing verification','','- Original key: '+primary,'- Wally key: '+backup,'- Model and key isolation: PASS','']
          print('Production workflow model/key isolation: PASS',flush=True)
          analyzer=GeminiAnalyzer(config=config,skills=[])
          assert analyzer._router is not None
          real_completion=analyzer._router.completion
          calls=[]
          def simulate_primary_failure(**kwargs):
              calls.append(kwargs['model'])
              if kwargs['model']==primary:
                  raise RuntimeError('Intentional primary failure for fallback verification')
              kwargs['timeout']=60
              return real_completion(**kwargs)
          analyzer._router.completion=simulate_primary_failure
          try:
              text,used_model,usage=analyzer._call_litellm_impl('Reply with OK only.',{'max_output_tokens':2048},system_prompt='This is an API availability test. Reply OK only.')
              assert used_model==backup and bool(text.strip())
              assert primary in calls and backup in calls
              summary += ['- Simulated primary failure -> real Wally API call: PASS','- Actual fallback model: '+used_model,'- Nonempty reply: YES']
              print(json.dumps({'fallback':'PASS','used_model':used_model,'nonempty_reply':True,'attempted_models':calls}),flush=True)
          except Exception as error:
              summary += ['- Real fallback request did not complete: '+type(error).__name__,'- Attempted models: '+', '.join(calls)]
              print(json.dumps({'fallback':'NOT_CONFIRMED','error_type':type(error).__name__,'attempted_models':calls}),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('\n'.join(summary)+'\n')
              sys.exit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('\n'.join(summary)+'\n')
          PY
