name: Gemini key check 1029
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare and test keys without revealing credentials
        env:
          CURRENT_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_KEYS: ${{ secrets.GEMINI_BACKUP_API_KEYS }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, concurrent.futures, hmac
          current = os.environ.get('CURRENT_KEY', '').strip()
          candidates = [k.strip() for k in os.environ.get('CANDIDATE_KEYS','').split(',') if k.strip()]
          labels = ['Darmy', 'Wally']
          keys = {'Existing': current, **dict(zip(labels, candidates))}
          rows = ['# Gemini key verification', '', '## Existing secret comparison']
          for label, key in zip(labels, candidates):
              row = label + ': matches existing GEMINI_API_KEY = ' + str(bool(current) and hmac.compare_digest(current, key))
              print(row, flush=True)
              rows.append('- ' + row)
          def test(item):
              label, key, endpoint = item
              if not key: return (label, endpoint, 'missing', 'No key configured')
              if endpoint == 'openai':
                  url = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions'
                  body = {'model':'gemini-3.6-flash','messages':[{'role':'user','content':'Reply OK only.'}],'max_tokens':128}
                  headers = {'Authorization':'Bearer '+key,'Content-Type':'application/json'}
              else:
                  url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent'
                  body = {'contents':[{'parts':[{'text':'Reply OK only.'}]}],'generationConfig':{'maxOutputTokens':128}}
                  headers = {'x-goog-api-key':key,'Content-Type':'application/json'}
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      json.load(response)
                      return (label, endpoint, str(response.status), 'SUCCESS')
              except urllib.error.HTTPError as error:
                  raw = error.read().decode()
                  for secret in keys.values():
                      if secret: raw = raw.replace(secret,'[REDACTED]')
                  try:
                      parsed = json.loads(raw)
                      if isinstance(parsed,list): parsed=parsed[0]
                      message = parsed.get('error',{}).get('message','Request rejected')
                  except Exception: message='Request rejected'
                  return (label, endpoint, str(error.code), message[:800])
              except Exception as error:
                  return (label, endpoint, 'network error', type(error).__name__)
          rows += ['', '## API test: gemini-3.6-flash', '', '| Key label | Endpoint | HTTP | Result |', '|---|---|---|---|']
          tasks = [(label,key,endpoint) for label,key in keys.items() for endpoint in ('openai','native')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for label,endpoint,status,message in pool.map(test,tasks):
                  print(json.dumps({'key_label':label,'endpoint':endpoint,'http':status,'result':message}), flush=True)
                  rows.append('| '+ ' | '.join([label,endpoint,status,message.replace('|','/').replace('\n',' ')])+' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('\n'.join(rows)+'\n')
          PY
